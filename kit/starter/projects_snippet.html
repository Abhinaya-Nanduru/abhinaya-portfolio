<!-- ===================================================================
     OPTION C AND D ONLY.

     In index.html, delete the two <article class="project"> blocks and
     paste this in their place, directly under <h2>Projects</h2>.

     The project list now comes from your backend instead of being typed
     into the page. To add a project you edit static/projects.json.
     =================================================================== -->

<div id="project-list"><p class="meta">Loading...</p></div>

    <script>
    // Ask our own backend for the project list, then build the HTML here.
    fetch("/api/projects")
      .then(res => {
        if (!res.ok) throw new Error("the server said " + res.status);
        return res.json();
      })
      .then(projects => {
        const box = document.getElementById("project-list");
        box.textContent = "";                 // clear "Loading..."
        for (const p of projects) {
          const article = document.createElement("article");
          article.className = "project";
          // createElement and textContent, never innerHTML with data.
          const h3 = document.createElement("h3");
          h3.textContent = p.name;
          const what = document.createElement("p");
          what.textContent = p.what;
          const tech = document.createElement("p");
          tech.className = "meta";
          tech.textContent = p.tech;
          article.append(h3, what, tech);
          box.append(article);
        }
      })
      .catch(err => {
        document.getElementById("project-list").textContent =
          "Could not load projects: " + err.message;
      });
    </script>
